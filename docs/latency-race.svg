<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .card{fill:#ffffff;stroke:#d0d7de} .lbl{fill:#1f2328;font-size:14px;font-weight:600} .val{fill:#1f2328;font-size:13px;font-weight:700}
    .sub{fill:#59636e;font-size:12px} .track{fill:#eef1f4} .big{fill:#2f9e61;font-size:22px;font-weight:800}
    @media (prefers-color-scheme: dark) { .card{fill:#0d1117;stroke:#30363d} .lbl,.val{fill:#e6edf3} .big{fill:#6fcf97} .sub{fill:#9198a1} .track{fill:#21262d} }
  </style>
  <rect x="1" y="1" width="718" height="168" rx="10" class="card"/>
  <text x="20" y="32" class="lbl">AI filter: 145 product checks, gemini-3.8-flash</text>
  
  <text x="20" y="69" class="lbl">All at once</text>
  <rect x="150" y="52" width="470" height="24" rx="6" class="track"/>
  <rect x="150" y="52" width="0" height="24" rx="6" fill="#2f9e61">
    <animate attributeName="width" values="0;470;470" keyTimes="0;0.0493;1" dur="14.56s" repeatCount="indefinite"/>
  </rect>
  <text x="630" y="69" class="val" opacity="0">72 s
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0493;0.0593;1" dur="14.56s" repeatCount="indefinite"/>
  </text>
  
  <text x="20" y="113" class="lbl">One at a time</text>
  <rect x="150" y="96" width="470" height="24" rx="6" class="track"/>
  <rect x="150" y="96" width="0" height="24" rx="6" fill="#8c959f">
    <animate attributeName="width" values="0;470;470" keyTimes="0;0.7937;1" dur="14.56s" repeatCount="indefinite"/>
  </rect>
  <text x="630" y="113" class="val" opacity="0">1,156 s (19 min)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7937;0.8037;1" dur="14.56s" repeatCount="indefinite"/>
  </text>
  <text x="700" y="34" text-anchor="end" class="big" opacity="0">16.1× faster
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0493;0.0593;1" dur="14.56s" repeatCount="indefinite"/>
  </text>
  <text x="20" y="152" class="sub">Both bars on the same clock, sped up 100×. Real times on the right.</text>
</svg>
